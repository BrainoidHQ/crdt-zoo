name: Deploy catalog to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "catalog/**"
      - "docs/book/**"
      - "tools/catalog-gen/**"
      - "proofs/**"
      - "crates/**"
      - ".github/workflows/pages.yml"
      - "Cargo.toml"
      - "Cargo.lock"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Install mdBook
        run: cargo install mdbook --locked

      - name: Generate catalog pages
        run: cargo run -p catalog-gen

      - name: Build mdBook
        run: mdbook build docs/book

      - name: Build Rust API docs
        run: cargo doc --workspace --no-deps

      - name: Copy Rust API docs into mdBook output
        run: |
          mkdir -p docs/book/book/rustdoc
          cp -R target/doc/* docs/book/book/rustdoc/

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/book/book

  deploy:
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
