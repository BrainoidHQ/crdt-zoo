name: Verification

on:
  pull_request:
  push:
    branches: [main]

jobs:
  rust:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --workspace

      - name: Build docs
        run: cargo doc --workspace --no-deps

  lean-tla:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Build Lean proofs
        run: nix develop --command bash -lc 'cd proofs/lean && lake build'

      - name: Parse shared TLA+ modules
        run: nix develop --command tlasany proofs/tla/modules/StateBasedCommon.tla

      - name: Run TLAPS proofs
        run: |
          nix develop --command bash -lc \
            'cd proofs/tla/algorithms/gcounter && tlapm --cleanfp --nofp --solver z3 --threads 1 GCounter.tla'

      - name: Run TLC models
        run: |
          nix develop --command bash -lc \
            'tlc -config proofs/tla/algorithms/gcounter/GCounter_MC.cfg proofs/tla/algorithms/gcounter/GCounter.tla'
