id = "orset"
slug = "orset"
name = "OR-Set"
long_name = "Observed-remove Set"
family = "set"
difficulty = "advanced"
summary = "A causally tracked add-wins set CRDT using dots and a causal context."
kind = ["state-based", "CvRDT"]
tags = ["set", "delete", "add-wins", "dot", "causal-context", "state-based"]

[docs]
readme = "README.md"
spec = "spec.md"
examples = "examples.md"
proofs = "proofs.md"

[rust]
crate = "crdt-algorithms"
module = "sets::orset"
type = "ORSet"
status = "implemented"
source = "../../crates/crdt-algorithms/src/sets/orset.rs"
api_docs_path = "rustdoc/crdt_algorithms/sets/orset/struct.ORSet.html"

[proofs]

[proofs.lean]
status = "proved"
file = "../../proofs/lean/Crdt/Algorithms/ORSet.lean"
theorems = [
  "Crdt.ORSet.add_contains_dot",
  "Crdt.ORSet.add_observes_dot",
  "Crdt.ORSet.add_inflationary",
  "Crdt.ORSet.remove_inflationary",
  "Crdt.ORSet.observed_remove_clears_dot",
  "Crdt.ORSet.concurrent_add_wins",
  "Crdt.ORSet.merge_monotone",
  "Crdt.ORSet.merge_converges_for_same_states",
]

[delivery]
causal_required = false
duplicate_tolerant = true
drop_tolerant = true
exactly_once_required = false

[features]
serde = false
no_std = false
delta = false
tombstone_free = false

[properties]
laws = [
  "join is associative",
  "join is commutative",
  "join is idempotent",
  "add is inflationary",
  "remove is inflationary",
  "observed remove clears observed dots",
  "concurrent add wins over remove",
]
